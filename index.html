<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0c0f">
<link rel="apple-touch-icon" href="icon.png">
<title>My Shifts</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#0b0c0f;--surface:#15171b;--surface2:#1d2127;--surface3:#2a3038;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#f5f7fa;--text2:#aab2bf;--text3:#6b7280;
  --blue:#4A9EFF;--blue-dim:rgba(74,158,255,0.13);
  --green:#4CAF7D;--green-dim:rgba(76,175,125,0.13);
  --amber:#F5A623;--amber-dim:rgba(245,166,35,0.13);
  --red:#FF6B6B;--red-dim:rgba(255,107,107,0.13);
  --purple:#B57BFF;--purple-dim:rgba(181,123,255,0.13);
  --radius:14px;--radius-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
button,.nav-item,.day-cell,.s-card,.shift-btn,.user-card,.month-card,.act-btn,.nav-btn,.lang-btn,.user-switcher{
  transition:all 0.15s ease;
}

body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}
body.en{font-family:'Inter',sans-serif;direction:ltr;}
.app{max-width:100%;margin:0 auto;position:relative;min-height:100dvh;}

/* PAGE TRANSITIONS */
.page{
  position:absolute;width:100%;top:0;left:0;
  opacity:0;transform:translateX(18px);
  pointer-events:none;transition:opacity 0.22s ease,transform 0.22s ease;
  padding-bottom:80px;min-height:100dvh;
}
.page.active{opacity:1;transform:translateX(0);pointer-events:auto;position:relative;}
body.en .page{transform:translateX(-18px);}
body.en .page.active{transform:translateX(0);}

/* TOPBAR — compact */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 10px;background:linear-gradient(180deg,rgba(21,23,27,1) 0%,rgba(21,23,27,0.85) 60%,rgba(21,23,27,0) 100%);}
.topbar h1{font-size:20px;font-weight:700;}
.topbar p{font-size:11px;color:var(--text2);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:7px;}
.lang-btn{background:var(--surface2);border:0.5px solid var(--border2);border-radius:10px;padding:4px 9px;font-size:11px;font-weight:700;color:var(--text2);cursor:pointer;transition:all 0.15s;}
.lang-btn:active{transform:scale(0.92);background:var(--surface3);}
.user-switcher{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:4px 9px;cursor:pointer;transition:all 0.15s;}
.user-switcher:active{transform:scale(0.95);}
.user-switcher span{font-size:12px;font-weight:600;color:var(--text);}
.user-switcher svg{transition:transform 0.2s;}
.user-switcher.open svg{transform:rotate(180deg);}
.user-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;width:100%;background:rgba(21,23,27,0.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border2);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);border-radius:18px 18px 0 0;overflow:hidden;}
.nav-indicator{position:absolute;top:0;height:3px;width:25%;background:var(--blue);border-radius:0 0 3px 3px;transition:transform 0.3s cubic-bezier(.2,.8,.2,1);}

/* ANALYTICS */
.an-section{margin-bottom:14px;}
.an-section-title{font-size:12px;font-weight:700;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px;padding:0 2px;}
.an-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.an-card{background:var(--surface2);border-radius:var(--radius);padding:14px;border:1px solid var(--border2);}
.an-card.full{grid-column:1/-1;}
.an-card.highlight{border-color:rgba(74,158,255,0.3);background:var(--blue-dim);}
.an-card.highlight-green{border-color:rgba(76,175,125,0.3);background:var(--green-dim);}
.an-label{font-size:11px;color:var(--text2);margin-bottom:4px;}
.an-val{font-size:20px;font-weight:700;color:var(--text);}
.an-val.blue{color:var(--blue);text-shadow:0 0 12px rgba(74,158,255,0.3);}
.an-val.green{color:var(--green);text-shadow:0 0 12px rgba(76,175,125,0.25);}
.an-val.amber{color:var(--amber);}
.an-val.red{color:var(--red);}
.an-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.an-bar-wrap{margin-top:10px;}
.an-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:4px;}
.an-bar-track{background:var(--surface3);border-radius:4px;height:8px;overflow:hidden;}
.an-bar-fill{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(.2,.8,.2,1);}
.an-chart{margin-top:4px;}
.an-chart-bars{display:flex;align-items:flex-end;gap:4px;height:80px;padding:0 2px;}
.an-chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.an-chart-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;transition:height 0.5s cubic-bezier(.2,.8,.2,1);}
.an-chart-bar-lbl{font-size:8px;color:var(--text3);text-align:center;}
.an-prediction{background:linear-gradient(135deg,rgba(74,158,255,0.15),rgba(181,123,255,0.1));border:1px solid rgba(74,158,255,0.25);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.an-prediction h4{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px;}
.an-prediction-val{font-size:28px;font-weight:700;color:var(--text);margin:6px 0;}
.an-prediction-sub{font-size:12px;color:var(--text2);line-height:1.6;}
.an-streak{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:var(--radius);padding:14px;border:1px solid var(--border2);margin-bottom:8px;}
.an-streak-icon{font-size:24px;}
.an-streak-text h4{font-size:14px;font-weight:600;}
.an-streak-text p{font-size:12px;color:var(--text2);margin-top:2px;}
.an-empty{text-align:center;padding:40px 20px;color:var(--text3);}
.an-empty div{font-size:40px;margin-bottom:12px;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;cursor:pointer;gap:2px;transition:transform 0.18s cubic-bezier(.2,.8,.2,1);}
.nav-item:active{transform:scale(0.8);}
.nav-item span{font-size:10px;font-weight:500;color:var(--text3);transition:color 0.15s,font-weight 0.15s;}
.nav-item svg{width:21px;height:21px;stroke:var(--text3);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:0.7;transition:all 0.2s ease;}
.nav-item.active{transform:translateY(-3px) scale(1.05);}
.nav-item.active span{color:var(--blue);font-weight:600;}
.nav-item.active svg{stroke:var(--blue);opacity:1;transform:scale(1.1);filter:drop-shadow(0 0 6px rgba(74,158,255,0.4));}
@media(hover:hover){.nav-item:hover{opacity:0.85;}}

/* FAB */
.fab{position:fixed;bottom:90px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;border:none;box-shadow:0 10px 25px rgba(0,0,0,0.5),0 0 0 1px rgba(74,158,255,0.3);cursor:pointer;z-index:49;display:flex;align-items:center;justify-content:center;line-height:1;transition:all 0.2s ease;}
.fab:active{transform:scale(0.88);}
.fab.hide{transform:scale(0);opacity:0;pointer-events:none;}
body.en .fab{right:auto;left:16px;}

/* UNDO TOAST */
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface3);color:var(--text);font-size:13px;font-weight:500;padding:10px 16px;border-radius:24px;border:1px solid var(--border2);z-index:200;display:flex;align-items:center;gap:12px;opacity:0;transition:all 0.25s ease;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast-undo{background:none;border:none;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;padding:0;}

/* MONTH NAV */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;}
.nav-btn{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius-sm);width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);font-size:15px;transition:all 0.15s;}
.nav-btn:active{background:var(--surface2);transform:scale(0.92);}
.month-title{font-size:17px;font-weight:600;}

/* WEEKDAYS */
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:0 10px 5px;}
.weekdays span{font-size:10px;color:#9aa3af;font-weight:600;}

/* CALENDAR — bigger cells + shift backgrounds */
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 10px 10px;}
.day-cell{border-radius:var(--radius-sm);padding:5px 1px 4px;text-align:center;cursor:pointer;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;border:0.5px solid transparent;transition:all 0.15s;}
.day-cell:active{transform:scale(0.93);}
.day-cell.empty{cursor:default;pointer-events:none;}
.day-cell.off-day{background:rgba(245,166,35,0.07);}
.day-cell.today{border:1px solid rgba(74,158,255,0.5);background:rgba(74,158,255,0.07);box-shadow:0 0 0 1px rgba(74,158,255,0.15);}
.day-cell.today .day-num{background:var(--blue);color:#fff;border-radius:50%;}
.day-cell.shift-night{background:rgba(74,158,255,0.10);}
.day-cell.shift-full{background:rgba(76,175,125,0.10);}
.day-cell.shift-off-night{background:rgba(245,166,35,0.10);}
.day-cell.shift-off-full{background:rgba(255,107,107,0.10);}
.day-cell.shift-leave{background:rgba(181,123,255,0.10);}
.day-num{font-size:12px;font-weight:600;color:var(--text);width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.day-num.muted{color:var(--text3);}
.shift-dot{font-size:8px;padding:2px 4px;border-radius:5px;font-weight:600;line-height:1.3;max-width:96%;text-align:center;}
.dot-night{background:var(--blue-dim);color:var(--blue);}
.dot-full{background:var(--green-dim);color:var(--green);}
.dot-off-night{background:var(--amber-dim);color:var(--amber);}
.dot-off-full{background:var(--red-dim);color:var(--red);}
.dot-leave{background:var(--purple-dim);color:var(--purple);}

/* LEGEND — collapsible */
.legend-toggle{display:flex;align-items:center;gap:5px;padding:0 16px 6px;cursor:pointer;width:fit-content;}
.legend-toggle span{font-size:11px;color:var(--text2);}
.legend-toggle svg{width:13px;height:13px;stroke:var(--text2);fill:none;stroke-width:2;transition:transform 0.2s;}
.legend-toggle.open svg{transform:rotate(180deg);}
.legend{display:none;flex-wrap:wrap;gap:6px;padding:2px 16px 10px;}
.legend.open{display:flex;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);}
.legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* SUMMARY — horizontal scroll */
.summary{margin:0 0 10px;padding:0 12px;}
.summary-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.summary-scroll::-webkit-scrollbar{display:none;}
.s-card{background:var(--surface2);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border2);flex-shrink:0;min-width:150px;}
.s-card.clickable{cursor:pointer;}
.s-card.clickable:active{background:var(--surface3);transform:scale(0.94);}
.s-card.wide{min-width:165px;}
.s-label{font-size:11px;color:var(--text2);}
.s-val{font-size:18px;font-weight:700;margin-top:3px;}
.s-val.blue{color:var(--blue);text-shadow:0 0 12px rgba(74,158,255,0.35);}
.s-val.red{color:var(--red);}
.s-val.green{color:var(--green);text-shadow:0 0 12px rgba(76,175,125,0.3);}
.s-tap{font-size:10px;color:var(--text3);margin-top:2px;}
.month-card{margin:0 12px 10px;background:var(--surface);border-radius:var(--radius);border:0.5px solid var(--border);overflow:hidden;}
.month-card-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;}
.month-card-title{font-size:15px;font-weight:600;}
.month-card-right{display:flex;align-items:center;gap:8px;}
.month-card-total{font-size:15px;font-weight:700;color:var(--blue);}
.lock-badge{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;}
.lock-badge.locked{background:var(--red-dim);color:var(--red);}
.lock-badge.open{background:var(--green-dim);color:var(--green);}
.month-card-body{padding:0 16px 14px;display:none;border-top:0.5px solid var(--border);}
.month-card-body.open{display:block;}
.stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.stat-row:last-child{border-bottom:none;}
.stat-label{color:var(--text2);}
.stat-val{font-weight:600;}
.stat-val.blue{color:var(--blue);}
.stat-val.red{color:var(--red);}
.stat-val.green{color:var(--green);}
.stat-val.amber{color:var(--amber);}
.stat-val.purple{color:var(--purple);}
.action-row{display:flex;gap:8px;margin-top:10px;}
.act-btn{flex:1;padding:10px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.act-btn.export{background:var(--surface2);color:var(--text2);border:0.5px solid var(--border2);}
.act-btn.lock-btn{background:rgba(255,107,107,0.15);color:var(--red);border:0.5px solid rgba(255,107,107,0.25);}
.act-btn.unlock-btn{background:rgba(76,175,125,0.15);color:var(--green);border:0.5px solid rgba(76,175,125,0.25);}
.no-history{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
.leave-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px 12px;}
.leave-day{border-radius:var(--radius-sm);padding:5px 2px;text-align:center;cursor:pointer;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0.5px solid transparent;transition:all 0.15s;}
.leave-day.empty{cursor:default;pointer-events:none;}
.leave-day.selected{background:var(--purple-dim);border-color:rgba(181,123,255,0.4);}
.leave-day.has-shift{background:var(--green-dim);border-color:rgba(76,175,125,0.3);cursor:not-allowed;}
.leave-day.off-day-l{background:rgba(245,166,35,0.06);}
.leave-day-num{font-size:12px;font-weight:600;color:var(--text);}
.leave-day-num.muted{color:var(--text3);}
.leave-result{margin:0 12px 10px;background:var(--surface);border-radius:var(--radius);border:0.5px solid var(--border);padding:14px;}
.leave-result h4{font-size:14px;font-weight:600;color:var(--purple);margin-bottom:10px;}
.reason-input{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px;margin-bottom:10px;resize:none;}
.apply-btn{display:block;width:100%;padding:13px;background:var(--purple);border:none;border-radius:var(--radius);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.users-list{padding:0 12px;}
.user-card{background:var(--surface);border-radius:var(--radius);border:0.5px solid var(--border);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all 0.15s;}
.user-card:active{background:var(--surface2);}
.user-card.active-user{border-color:var(--blue);}
.user-card-left{display:flex;align-items:center;gap:12px;}
.user-card-info h4{font-size:14px;font-weight:600;}
.user-card-info p{font-size:12px;color:var(--text2);margin-top:2px;}
.edit-btn-sm{background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;}
.add-user-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:var(--blue-dim);border:0.5px solid rgba(74,158,255,0.3);border-radius:var(--radius);color:var(--blue);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin:0 12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:flex-end;z-index:100;backdrop-filter:blur(4px);}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px 36px;width:100%;max-width:100%;border-top:0.5px solid var(--border2);max-height:85dvh;overflow-y:auto;animation:slideUp 0.25s ease;}
body.en .modal{margin:0;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px;}
.shift-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px;margin-bottom:7px;border:0.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;font-weight:500;transition:all 0.15s;}
.shift-btn.active{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);}
.shift-bonus{font-size:13px;font-weight:700;color:var(--green);}
.shift-btn.active .shift-bonus{color:var(--blue);}
.cancel-btn{display:block;width:100%;text-align:center;padding:13px;border:none;background:var(--surface2);color:var(--text2);font-family:inherit;font-size:14px;cursor:pointer;margin-top:6px;border-radius:var(--radius-sm);}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:0.5px solid var(--border);}
.detail-row:last-child{border-bottom:none;}
.detail-date{font-size:14px;font-weight:600;}
.detail-type{font-size:12px;color:var(--text2);margin-top:2px;}
.detail-bonus{font-size:14px;font-weight:700;color:var(--blue);}
.detail-total{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border2);}
.detail-total span{font-size:14px;font-weight:600;}
.total-val{color:var(--blue);font-size:17px;}
.empty-msg{text-align:center;padding:24px;font-size:14px;color:var(--text2);}
.form-group{margin-bottom:12px;}
.form-label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;}
.form-input{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;}
.form-input:focus{outline:none;border-color:var(--blue);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-select{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:11px 13px;color:var(--text);font-family:inherit;font-size:14px;}
.preview-card{background:var(--blue-dim);border:0.5px solid rgba(74,158,255,0.25);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;}
.preview-card p{font-size:13px;color:var(--blue);line-height:1.8;}
.submit-btn{display:block;width:100%;padding:14px;background:var(--blue);border:none;border-radius:var(--radius);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;}
.delete-btn{display:block;width:100%;padding:12px;background:var(--red-dim);border:0.5px solid rgba(255,107,107,0.3);border-radius:var(--radius);color:var(--red);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;text-align:center;}
.adv-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);}
.adv-row:last-child{border-bottom:none;}
.adv-date{font-size:13px;color:var(--text2);}
.adv-amount{font-size:14px;font-weight:700;color:var(--red);}
.adv-note{font-size:11px;color:var(--text3);margin-top:2px;}
.adv-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:4px;}
</style>
</head>
<body>

<script>
// TRANSLATIONS
const T={
  ar:{

    legend:['بليل','صبح+بليل','بليل إج','صبح+بليل إج','إجازة'],
    baseSalary:'المرتب الأساسي',nightDays:'شيفت بليل عادي',fullDays:'صبح + بليل عادي',
    offNightDays:'بليل يوم إجازة',offFullDays:'صبح+بليل يوم إجازة',totalBonusH:'إجمالي الزيادة',
    leaveDeductH:'أيام إجازة مخصومة',monthTotalH:'إجمالي الشهر',netAfterH:'الصافي بعد السلف',
    reportFor:'تقرير',reportSalary:'مرتب',day:'يوم',leave2:'إجازة',
    confirmDelete:'هتحذف المستخدم ده وكل بياناته؟',checkData:'تأكد من البيانات'

    addUser:'Add User',salary:'Salary',daily:'Daily',

    advance:'Advances',monthTotal:'Month Total',tapDetails:'Tap for details',
    tapAdvance:'Tap to manage',nightShift:'Night shift (regular)',fullShift:'Morning + Night (regular)',
    offNight:'Night shift (day off)',offFull:'Morning + Night (day off)',noShift:'Nothing',
    leaveDay:'Leave',locked:'🔒 Locked',unlocked:'Open',lockMonth:'🔒 Lock Month',

    newUser:'New User',editUser:'Edit',name:'Name',monthlySalary:'Monthly Salary (EGP)',
    offDay:'Day Off',wdHours:'Weekdays — From / To',weHours:'Weekends — From / To',
    previewTitle:'Preview Calculations',shiftHours:'Shift Hours',hourly:'Per Hour',
    bonusFullNormal:'Bonus morning+night regular',bonusFullOff:'Bonus morning+night day off',
    leaveTitle:'Selected Leave',deductAmount:'Deduction Amount',applyLeave:'✓ Register Leave',
    leaveReason:'Reason (optional)',advanceTitle:'Advances',addAdvance:'+ Add Advance',
    advAmount:'Amount (EGP)',advNote:'Note (optional)',advDate:'Date',
    noAdvances:'No advances recorded',netAfterAdv:'Net After Advances',
    months:['January','February','March','April','May','June','July','August','September','October','November','December'],
    days:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
    daysShort:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],
    legend:['Night','Mor+Night','Night Off','Mor+Night Off','Leave'],
    baseSalary:'Base Salary',nightDays:'Night shift regular',fullDays:'Morning + Night regular',
    offNightDays:'Night shift day off',offFullDays:'Mor+Night day off',totalBonusH:'Total Bonus',
    leaveDeductH:'Leave days deducted',monthTotalH:'Month Total',netAfterH:'Net After Advances',
    reportFor:'Report',reportSalary:'Salary',day:'day',leave2:'Leave',
    confirmDelete:'Delete this user and all their data?',checkData:'Check data — something is wrong'
  }
};

let lang='ar';
function t(k){return T[lang][k]||k;}

function toggleLang(){
  lang=lang==='ar'?'en':'ar';
  document.body.classList.toggle('en',lang==='en');
  document.documentElement.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  document.querySelectorAll('.lang-btn').forEach(b=>b.textContent=lang==='ar'?'EN':'عر');
  updateAllLabels();
  const active=document.querySelector('.page.active');
  if(active){
    const pid=active.id.replace('page-','');
    if(pid==='calendar') render();
    if(pid==='history') renderHistory();
    if(pid==='leave') renderLeaveCalendar();
    if(pid==='users') renderUsers();
  }
}

function toggleLegend(){
  const leg=document.getElementById('cal-legend');
  const tog=document.getElementById('legend-toggle');
  leg.classList.toggle('open');
  tog.classList.toggle('open');
}

function updateAllLabels(){
  const ids={
    'nav-lbl-calendar':'calendar','nav-lbl-history':'history','nav-lbl-leave':'leave',
    'add-user-lbl':'addUser'
  };
  Object.entries(ids).forEach(([id,key])=>{const el=document.getElementById(id);if(el)el.textContent=t(key);});
  const lt=document.getElementById('legend-toggle-lbl');
  if(lt) lt.textContent=lang==='ar'?'ألوان التقويم':'Legend';
}

// DATA
const COLORS=['#4A9EFF','#4CAF7D','#F5A623','#FF6B6B','#B57BFF','#FF9F43','#26de81'];
const START=new Date(2026,4,1);
const DEFAULT_USERS=[{id:'hamza',name:'حمزة',salary:7000,offDay:0,wdStart:14,wdEnd:23,weStart:15,weEnd:24,color:'#4A9EFF'}];

function loadDB(){try{return JSON.parse(localStorage.getItem('myshifts_v3')||'null');}catch(e){return null;}}
function saveDB(){localStorage.setItem('myshifts_v3',JSON.stringify(DB));}

let DB=loadDB()||{users:DEFAULT_USERS,shifts:{},locks:{},advances:{}};
if(!DB.users||!DB.users.length) DB.users=DEFAULT_USERS;
if(!DB.shifts) DB.shifts={};
if(!DB.locks) DB.locks={};
if(!DB.advances) DB.advances={};

let currentUser=DB.users[0].id;
let yr=2026,mo=4,leaveYr=2026,leaveMo=4;
let leaveSelected=new Set();
let selDay=null;

function getUser(id){return DB.users.find(u=>u.id===id)||DB.users[0];}
function curUser(){return getUser(currentUser);}
function key(uid,y,m,d){return `${uid}|${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function monthKey(uid,y,m){return `${uid}|${y}-${String(m+1).padStart(2,'0')}`;}
function isLocked(uid,y,m){return !!DB.locks[monthKey(uid,y,m)];}
function isOffDay(y,m,d,offDay){return new Date(y,m,d).getDay()===offDay;}
function beforeStart(y,m,d){return new Date(y,m,d)<START;}
function avatarLetter(name){return name.charAt(0);}
function colorForUser(u){return u.color||COLORS[0];}

function userCalc(u){
  const daily=u.salary/30;
  const wdHours=u.wdEnd-u.wdStart;
  const hourly=u.salary/(30*wdHours);
  return {daily,hourly,wdHours,fullBonus:daily,offNightBonus:daily,offFullBonus:daily+(4*hourly*1.5)};
}

function getBonus(u,shiftId){
  const c=userCalc(u);
  if(shiftId==='full') return c.fullBonus;
  if(shiftId==='off-night') return c.offNightBonus;
  if(shiftId==='off-full') return c.offFullBonus;
  if(shiftId==='leave') return -c.daily;
  return 0;
}

function getShiftLabel(id){
  const map={none:t('noShift'),night:t('nightShift'),full:t('fullShift'),'off-night':t('offNight'),'off-full':t('offFull'),leave:t('leaveDay')};
  return map[id]||id;
}

function getMonthAdvances(uid,y,m){
  const mk=monthKey(uid,y,m);
  return (DB.advances[mk]||[]);
}

function getTotalAdvance(uid,y,m){
  return getMonthAdvances(uid,y,m).reduce((a,b)=>a+b.amount,0);
}

// PAGE
function showPage(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  const navEl=document.getElementById('nav-'+p);
  if(navEl) navEl.classList.add('active');
  updateTopbars();
  if(p==='history') renderHistory();
  if(p==='leave'){leaveSelected=new Set();renderLeaveCalendar();}
  if(p==='users') renderUsers();
  if(p==='calendar') render();
  if(p==='analytics') setTimeout(()=>renderAnalytics(),0);
}

function updateTopbars(){
  const u=curUser();
  const c=userCalc(u);
  ['cal','hist','leave','analytics'].forEach(p=>{
    const nm=document.getElementById(p+'-user-name')||document.getElementById(p==='analytics'?'analytics-sub':p+'-user-name');
    const av=document.getElementById(p+'-avatar')||document.getElementById(p==='analytics'?'analytics-avatar':p+'-avatar');
    const sh=document.getElementById(p+'-user-short')||document.getElementById(p==='analytics'?'analytics-user-short':p+'-user-short');
    if(nm) nm.textContent=`${u.salary.toLocaleString()} — ${t('daily')} ${c.daily.toFixed(0)}`;
    if(av){av.textContent=avatarLetter(u.name);av.style.background=colorForUser(u);}
    if(sh) sh.textContent=u.name;
  });
}

function openUserSwitch(){
  document.querySelectorAll('.user-switcher').forEach(el=>el.classList.add('open'));
  const items=DB.users.map(u=>`
    <div class="user-card ${u.id===currentUser?'active-user':''}" onclick="switchUser('${u.id}')">
      <div class="user-card-left">
        <div class="user-avatar" style="background:${colorForUser(u)};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff">${avatarLetter(u.name)}</div>
        <div class="user-card-info"><h4>${u.name}</h4><p>${u.salary.toLocaleString()} EGP</p></div>
      </div>
      ${u.id===currentUser?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A9EFF" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>':''}
    </div>`).join('');
  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <h3>${t('switchUser')}</h3>${items}
        <button class="submit-btn" style="margin-top:10px;background:var(--surface2);color:var(--text2)" onclick="closeModal();showPage('users')">
          ⚙️ ${t('users')}
        </button>
        <button class="cancel-btn" onclick="closeModal()">${t('cancel')}</button>
      </div>
    </div>`;
}

function switchUser(id){
  currentUser=id;
  closeModal();
  updateTopbars();
  render();
  leaveSelected=new Set();
  renderLeaveCalendar();
}

// CALENDAR
function renderWeekdays(containerId){
  const el=document.getElementById(containerId);
  if(!el) return;
  el.innerHTML=T[lang].daysShort.map(d=>`<span>${d}</span>`).join('');
}

function render(){
  updateTopbars();renderWeekdays('cal-weekdays');
  document.getElementById('month-label').textContent=T[lang].months[mo]+' '+yr;
  const u=curUser();
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const first=new Date(yr,mo,1).getDay();
  const days=new Date(yr,mo+1,0).getDate();
  const today=new Date();
  const locked=isLocked(u.id,yr,mo);
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day-cell empty';grid.appendChild(e);}
  for(let d=1;d<=days;d++){
    const cell=document.createElement('div');
    const k=key(u.id,yr,mo,d);
    const shift=DB.shifts[k]||'none';
    const offDay=isOffDay(yr,mo,d,u.offDay);
    const before=beforeStart(yr,mo,d);
    const isToday=today.getDate()===d&&today.getMonth()===mo&&today.getFullYear()===yr;
    cell.className='day-cell'+(offDay?' off-day':'')+(isToday?' today':'');
    const shiftClassMap={night:'shift-night',full:'shift-full','off-night':'shift-off-night','off-full':'shift-off-full',leave:'shift-leave'};
    if(shiftClassMap[shift]) cell.classList.add(shiftClassMap[shift]);
    const num=document.createElement('div');
    num.className='day-num'+(before?' muted':'');
    num.textContent=d;
    cell.appendChild(num);
    const dotMap={night:'dot-night',full:'dot-full','off-night':'dot-off-night','off-full':'dot-off-full',leave:'dot-leave'};
    const dotLabel=T[lang].legend;
    const dotIdx={night:0,full:1,'off-night':2,'off-full':3,leave:4};
    if(shift!=='none'){
      const dot=document.createElement('div');
      dot.className='shift-dot '+(dotMap[shift]||'');
      dot.textContent=dotLabel[dotIdx[shift]]||shift;
      cell.appendChild(dot);
    }
    if(!before&&!locked){
      cell.addEventListener('touchstart',()=>startPress(d),{passive:true});
      cell.addEventListener('touchend',()=>endPress(d),{passive:true});
      cell.addEventListener('touchcancel',()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}});
      cell.onclick=null;
    }
    grid.appendChild(cell);
  }
  // legend
  const lc=['#4A9EFF','#4CAF7D','#F5A623','#FF6B6B','#B57BFF'];
  document.getElementById('cal-legend').innerHTML=T[lang].legend.map((l,i)=>`<div class="legend-item"><div class="legend-dot" style="background:${lc[i]}"></div>${l}</div>`).join('');
  renderSummary();
}

function renderSummary(){
  const u=curUser();const c=userCalc(u);
  const prefix=`${u.id}|${yr}-${String(mo+1).padStart(2,'0')}-`;
  let bonus=0,count=0,leaveDeduct=0,leaveDays=0;
  Object.keys(DB.shifts).forEach(k=>{
    if(!k.startsWith(prefix)) return;
    const v=DB.shifts[k];
    if(v==='leave'){leaveDays++;leaveDeduct+=c.daily;}
    else if(v!=='none'){count++;bonus+=getBonus(u,v);}
  });
  const adv=getTotalAdvance(u.id,yr,mo);

function openDetail(){
  const u=curUser();
  const prefix=`${u.id}|${yr}-${String(mo+1).padStart(2,'0')}-`;
  const days=[];
  Object.keys(DB.shifts).filter(k=>k.startsWith(prefix)&&DB.shifts[k]!=='none'&&DB.shifts[k]!=='leave'&&getBonus(u,DB.shifts[k])>0).sort().forEach(k=>{

    :days.map(x=>`<div class="detail-row"><div><div class="detail-date">${x.dayName} ${x.d} ${T[lang].months[mo]}</div><div class="detail-type">${getShiftLabel(x.shift)}</div></div><div class="detail-bonus">+${x.bonus.toFixed(0)}</div></div>`).join('');

function addAdvance(mk){
  const amount=parseFloat(document.getElementById('adv-amount').value);
  const date=document.getElementById('adv-date').value;
  const note=document.getElementById('adv-note').value.trim();
  if(!amount||amount<=0) return;
  if(!DB.advances[mk]) DB.advances[mk]=[];
  DB.advances[mk].push({amount,date,note});
  saveDB();closeModal();render();
}

function deleteAdvance(mk,idx){
  DB.advances[mk].splice(idx,1);
  if(!DB.advances[mk].length) delete DB.advances[mk];
  saveDB();closeModal();render();
}

function closeModal(e){
  if(!e||e.target.classList.contains('overlay')){
    document.getElementById('modal-root').innerHTML='';
    document.querySelectorAll('.user-switcher').forEach(el=>el.classList.remove('open'));
  }
}
function changeMonth(dir){mo+=dir;if(mo>11){mo=0;yr++;}if(mo<0){mo=11;yr--;}render();}

// HISTORY
function renderHistory(){
  updateTopbars();
  const u=curUser();const c=userCalc(u);
  const months={};
  const prefix=u.id+'|';
  Object.keys(DB.shifts).forEach(k=>{
    if(!k.startsWith(prefix)) return;
    const parts=k.split('|')[1].split('-');
    const mk=`${parts[0]}-${parts[1]}`;
    if(!months[mk]) months[mk]={bonus:0,deduct:0,shifts:{night:0,full:0,'off-night':0,'off-full':0},leaveDays:0};
    const v=DB.shifts[k];
    if(v==='leave'){months[mk].leaveDays++;months[mk].deduct+=c.daily;}
    else if(v!=='none'){months[mk].shifts[v]=(months[mk].shifts[v]||0)+1;months[mk].bonus+=getBonus(u,v);}
  });
  const keys=Object.keys(months).sort().reverse();
  const el=document.getElementById('history-list');
  if(!keys.length){el.innerHTML=`<div class="no-history"><div style="font-size:40px;margin-bottom:12px">📊</div>${t('noData')}<br><span style="font-size:12px;color:var(--text3);margin-top:6px;display:block">${lang==='ar'?'ابدأ بتسجيل الشيفتات من التقويم':'Start by logging shifts in the calendar'}</span></div>`;return;}
  el.innerHTML=keys.map(mk=>{
    const [y,m]=mk.split('-');
    const mi=parseInt(m)-1;
    const d=months[mk];
    const adv=getTotalAdvance(u.id,parseInt(y),parseInt(m)-1);
    const total=u.salary+d.bonus-d.deduct;
    const net=total-adv;
    const locked=isLocked(u.id,parseInt(y),parseInt(m)-1);
    return `
    <div class="month-card">
      <div class="month-card-header" onclick="toggleHistory('${mk}')">
        <span class="month-card-title">${T[lang].months[mi]} ${y}</span>
        <div class="month-card-right">
          <span class="lock-badge ${locked?'locked':'open'}">${locked?t('locked'):t('unlocked')}</span>
          <span class="month-card-total">${net.toFixed(0)}</span>
        </div>
      </div>
      <div class="month-card-body" id="hist-${mk}">
        <div class="stat-row"><span class="stat-label">${t('baseSalary')}</span><span class="stat-val">${u.salary.toLocaleString()}</span></div>
        ${d.shifts.night>0?`<div class="stat-row"><span class="stat-label">${t('nightDays')}</span><span class="stat-val blue">${d.shifts.night} ${t('day')}</span></div>`:''}
        ${d.shifts.full>0?`<div class="stat-row"><span class="stat-label">${t('fullDays')}</span><span class="stat-val green">${d.shifts.full} ${t('day')} (+${(d.shifts.full*c.fullBonus).toFixed(0)})</span></div>`:''}
        ${(d.shifts['off-night']||0)>0?`<div class="stat-row"><span class="stat-label">${t('offNightDays')}</span><span class="stat-val amber">${d.shifts['off-night']} ${t('day')} (+${(d.shifts['off-night']*c.offNightBonus).toFixed(0)})</span></div>`:''}
        ${(d.shifts['off-full']||0)>0?`<div class="stat-row"><span class="stat-label">${t('offFullDays')}</span><span class="stat-val red">${d.shifts['off-full']} ${t('day')} (+${(d.shifts['off-full']*c.offFullBonus).toFixed(0)})</span></div>`:''}
        <div class="stat-row"><span class="stat-label">${t('totalBonusH')}</span><span class="stat-val blue">+${d.bonus.toFixed(0)}</span></div>
        ${d.leaveDays>0?`<div class="stat-row"><span class="stat-label">${t('leaveDeductH')}</span><span class="stat-val red">-${d.deduct.toFixed(0)} (${d.leaveDays} ${t('day')})</span></div>`:''}
        <div class="stat-row"><span class="stat-label">${t('monthTotalH')}</span><span class="stat-val ${total>=u.salary?'green':'red'}">${total.toFixed(0)}</span></div>
        ${adv>0?`<div class="stat-row"><span class="stat-label">${t('advance')}</span><span class="stat-val red">-${adv.toFixed(0)}</span></div><div class="stat-row"><span class="stat-label">${t('netAfterH')}</span><span class="stat-val ${net>=u.salary?'green':'red'}">${net.toFixed(0)}</span></div>`:''}
        <div class="action-row">
          <button class="act-btn export" onclick="exportMonth('${u.id}','${mk}',event)">${t('exportTxt')}</button>
          <button class="act-btn ${locked?'unlock-btn':'lock-btn'}" onclick="toggleLock('${u.id}','${mk}',event)">${locked?t('unlockMonth'):t('lockMonth')}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleHistory(mk){document.getElementById('hist-'+mk).classList.toggle('open');}

function toggleLock(uid,mk,e){
  e.stopPropagation();
  const lk=uid+'|'+mk;
  if(DB.locks[lk]) delete DB.locks[lk]; else DB.locks[lk]=true;
  saveDB();renderHistory();render();
}

function exportMonth(uid,mk,e){
  e.stopPropagation();
  const u=getUser(uid);const c=userCalc(u);
  const [y,m]=mk.split('-');const mi=parseInt(m)-1;
  const prefix=`${uid}|${y}-${m}-`;
  let lines=[`============================`,`${t('reportFor')} ${u.name} — ${T[lang].months[mi]} ${y}`,`${t('reportSalary')}: ${u.salary.toLocaleString()}`,`============================`,``];
  let bonus=0,deduct=0;
  Object.keys(DB.shifts).filter(k=>k.startsWith(prefix)&&DB.shifts[k]!=='none').sort().forEach(k=>{
    const d=parseInt(k.split('|')[1].split('-')[2]);
    const v=DB.shifts[k];
    const dt=new Date(parseInt(y),mi,d);
    const dayName=T[lang].days[dt.getDay()];
    if(v==='leave'){lines.push(`${dayName} ${d}/${m}/${y} — ${t('leave2')} (-${c.daily.toFixed(0)})`);deduct+=c.daily;}
    else{const b=getBonus(u,v);lines.push(`${dayName} ${d}/${m}/${y} — ${getShiftLabel(v)}${b>0?' (+'+b.toFixed(0)+')':''}`);bonus+=b;}
  });
  const advList=getMonthAdvances(uid,parseInt(y),mi);
  if(advList.length){lines.push('');lines.push('--- Advances ---');advList.forEach(a=>lines.push(`${a.date}: -${a.amount.toFixed(0)}${a.note?' ('+a.note+')':''}`));}
  const adv=getTotalAdvance(uid,parseInt(y),mi);
  const net=u.salary+bonus-deduct-adv;
  lines.push(``);lines.push(`============================`);
  lines.push(`${t('totalBonusH')}: +${bonus.toFixed(0)}`);
  if(deduct>0) lines.push(`${t('leaveDeductH')}: -${deduct.toFixed(0)}`);
  if(adv>0) lines.push(`${t('advance')}: -${adv.toFixed(0)}`);
  lines.push(`${t('monthTotalH')}: ${net.toFixed(0)}`);
  lines.push(`============================`);
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${u.name}_${y}_${m}.txt`;a.click();
}

// LEAVE
function renderLeaveCalendar(){
  updateTopbars();renderWeekdays('leave-weekdays');
  document.getElementById('leave-month-label').textContent=T[lang].months[leaveMo]+' '+leaveYr;
  const u=curUser();
  const grid=document.getElementById('leave-grid');
  grid.innerHTML='';
  const first=new Date(leaveYr,leaveMo,1).getDay();
  const days=new Date(leaveYr,leaveMo+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='leave-day empty';grid.appendChild(e);}
  for(let d=1;d<=days;d++){
    const cell=document.createElement('div');
    const k=key(u.id,leaveYr,leaveMo,d);
    const shift=DB.shifts[k]||'none';
    const offDay=isOffDay(leaveYr,leaveMo,d,u.offDay);
    const before=beforeStart(leaveYr,leaveMo,d);
    const dkey=`${leaveYr}-${leaveMo}-${d}`;
    const isSelected=leaveSelected.has(dkey);
    const hasShift=shift!=='none'&&shift!=='leave';
    cell.className='leave-day'+(offDay?' off-day-l':'')+(isSelected?' selected':'')+(hasShift?' has-shift':'');
    const num=document.createElement('div');
    num.className='leave-day-num'+(before?' muted':'');
    num.textContent=d;
    cell.appendChild(num);
    if(!before&&!hasShift&&!offDay){
      cell.onclick=()=>{if(isSelected) leaveSelected.delete(dkey); else leaveSelected.add(dkey);renderLeaveCalendar();};
    }
    grid.appendChild(cell);
  }
  renderLeaveResult();
}

function renderLeaveResult(){
  const box=document.getElementById('leave-result-box');
  if(!leaveSelected.size){box.innerHTML='';return;}
  const u=curUser();const c=userCalc(u);
  const deductAmount=leaveSelected.size*c.daily;
  box.innerHTML=`
    <div class="leave-result">
      <h4>${t('leaveTitle')} — ${leaveSelected.size} ${t('day')}</h4>
      <div class="stat-row"><span class="stat-label">${t('deductAmount')}</span><span class="stat-val red">-${deductAmount.toFixed(0)}</span></div>
      <textarea class="reason-input" id="leave-reason" placeholder="${t('leaveReason')}" rows="2"></textarea>
      <button class="apply-btn" onclick="applyLeave()">${t('applyLeave')}</button>
    </div>`;
}

function applyLeave(){
  const u=curUser();
  leaveSelected.forEach(dkey=>{
    const[y,m,d]=dkey.split('-');
    DB.shifts[key(u.id,parseInt(y),parseInt(m),parseInt(d))]='leave';
  });
  saveDB();leaveSelected=new Set();renderLeaveCalendar();render();
}

function changeLeaveMonth(dir){leaveMo+=dir;if(leaveMo>11){leaveMo=0;leaveYr++;}if(leaveMo<0){leaveMo=11;leaveYr--;}leaveSelected=new Set();renderLeaveCalendar();}

function showUserForm(u){

        <h3>${isEdit?u.name:t('newUser')}</h3>
        <div class="form-group"><label class="form-label">${t('name')}</label><input class="form-input" id="f-name" value="${isEdit?u.name:''}" placeholder="${t('name')}"></div>
        <div class="form-group"><label class="form-label">${t('monthlySalary')}</label><input class="form-input" id="f-salary" type="number" value="${isEdit?u.salary:''}" oninput="updatePreview()"></div>
        <div class="form-group"><label class="form-label">${t('offDay')}</label>
          <select class="form-select" id="f-offday">${T[lang].days.map((d,i)=>`<option value="${i}" ${isEdit&&u.offDay===i?'selected':''}>${d}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label class="form-label">${t('wdHours')}</label>
          <div class="form-row"><input class="form-input" id="f-wdstart" type="number" min="0" max="23" value="${isEdit?u.wdStart:14}" oninput="updatePreview()"><input class="form-input" id="f-wdend" type="number" min="1" max="24" value="${isEdit?u.wdEnd:23}" oninput="updatePreview()"></div>
        </div>
        <div class="form-group"><label class="form-label">${t('weHours')}</label>
          <div class="form-row"><input class="form-input" id="f-westart" type="number" min="0" max="23" value="${isEdit?u.weStart:15}"><input class="form-input" id="f-weend" type="number" min="1" max="24" value="${isEdit?u.weEnd:24}"></div>
        </div>
        <div class="preview-card" id="f-preview"></div>
        <button class="submit-btn" onclick="saveUser('${isEdit?u.id:''}')">${isEdit?t('saveEdit'):t('createUser')}</button>
        ${isEdit&&u.id!=='hamza'?`<button class="delete-btn" onclick="deleteUser('${u.id}')">${t('deleteUser')}</button>`:''}
        <button class="cancel-btn" onclick="closeModal()">${t('cancel')}</button>
      </div>

function updatePreview(){
  const salary=parseFloat(document.getElementById('f-salary')?.value)||0;
  const wdStart=parseInt(document.getElementById('f-wdstart')?.value)||0;
  const wdEnd=parseInt(document.getElementById('f-wdend')?.value)||0;
  const preview=document.getElementById('f-preview');
  if(!preview) return;
  if(!salary||wdEnd<=wdStart){preview.innerHTML=`<p style="color:var(--text3)">${t('previewTitle')}</p>`;return;}
  const daily=salary/30;
  const hours=wdEnd-wdStart;
  const hourly=salary/(30*hours);
  const offFull=daily+(4*hourly*1.5);
  preview.innerHTML=`<p>
    ${t('daily')}: <b>${daily.toFixed(2)}</b><br>
    ${t('shiftHours')}: <b>${hours}h</b><br>
    ${t('hourly')}: <b>${hourly.toFixed(2)}</b><br>
    ${t('bonusFullNormal')}: <b>+${daily.toFixed(0)}</b><br>
    ${t('bonusFullOff')}: <b>+${offFull.toFixed(0)}</b>
  </p>`;
}

function saveUser(id){
  const name=document.getElementById('f-name').value.trim();
  const salary=parseFloat(document.getElementById('f-salary').value);
  const offDay=parseInt(document.getElementById('f-offday').value);
  const wdStart=parseInt(document.getElementById('f-wdstart').value);
  const wdEnd=parseInt(document.getElementById('f-wdend').value);
  const weStart=parseInt(document.getElementById('f-westart').value);
  const weEnd=parseInt(document.getElementById('f-weend').value);
  if(!name||!salary||wdEnd<=wdStart){alert(t('checkData'));return;}
  if(id){const u=getUser(id);u.name=name;u.salary=salary;u.offDay=offDay;u.wdStart=wdStart;u.wdEnd=wdEnd;u.weStart=weStart;u.weEnd=weEnd;}
  else{DB.users.push({id:'user_'+Date.now(),name,salary,offDay,wdStart,wdEnd,weStart,weEnd,color:COLORS[DB.users.length%COLORS.length]});}
  saveDB();closeModal();renderUsers();updateTopbars();
}

function deleteUser(id){
  if(!confirm(t('confirmDelete'))) return;
  DB.users=DB.users.filter(u=>u.id!==id);
  Object.keys(DB.shifts).forEach(k=>{if(k.startsWith(id+'|')) delete DB.shifts[k];});
  Object.keys(DB.advances).forEach(k=>{if(k.startsWith(id+'|')) delete DB.advances[k];});
  if(currentUser===id) currentUser=DB.users[0].id;
  saveDB();closeModal();renderUsers();updateTopbars();render();
}

// ANALYTICS
function renderAnalytics(){
  updateTopbars();
  const u=curUser();
  const c=userCalc(u);
  const el=document.getElementById('analytics-content');
  const isAr=lang==='ar';

  // Gather all months data
  const months={};
  const prefix=u.id+'|';
  Object.keys(DB.shifts).forEach(k=>{
    if(!k.startsWith(prefix)) return;
    const parts=k.split('|')[1].split('-');
    const mk=`${parts[0]}-${parts[1]}`;
    if(!months[mk]) months[mk]={bonus:0,deduct:0,nights:0,fulls:0,offNights:0,offFulls:0,leaveDays:0,totalShifts:0};
    const v=DB.shifts[k];
    if(v==='leave'){months[mk].leaveDays++;months[mk].deduct+=c.daily;}
    else if(v==='night'){months[mk].nights++;months[mk].bonus+=0;months[mk].totalShifts++;}
    else if(v==='full'){months[mk].fulls++;months[mk].bonus+=c.fullBonus;months[mk].totalShifts++;}
    else if(v==='off-night'){months[mk].offNights++;months[mk].bonus+=c.offNightBonus;months[mk].totalShifts++;}
    else if(v==='off-full'){months[mk].offFulls++;months[mk].bonus+=c.offFullBonus;months[mk].totalShifts++;}
  });

  const mkKeys=Object.keys(months).sort();
  if(!mkKeys.length){
    el.innerHTML=`<div class="an-empty"><div>📊</div>${isAr?'مفيش بيانات لحد دلوقتي':'No data yet'}<br><span style="font-size:12px;color:var(--text3)">${isAr?'ابدأ بتسجيل الشيفتات':'Start logging shifts'}</span></div>`;
    return;
  }

  // Calculate totals per month
  const monthTotals=mkKeys.map(mk=>{
    const d=months[mk];
    const adv=getTotalAdvance(u.id,parseInt(mk.split('-')[0]),parseInt(mk.split('-')[1])-1);
    return {mk,net:u.salary+d.bonus-d.deduct-adv,...d,adv};
  });

  const allNets=monthTotals.map(m=>m.net);
  const avgNet=allNets.reduce((a,b)=>a+b,0)/allNets.length;
  const maxNet=Math.max(...allNets);
  const maxMk=monthTotals.find(m=>m.net===maxNet)?.mk||'';
  const [maxY,maxM]=maxMk.split('-');

  const allBonus=monthTotals.map(m=>m.bonus);
  const avgBonus=allBonus.reduce((a,b)=>a+b,0)/allBonus.length;
  const totalShiftsAll=monthTotals.reduce((a,m)=>a+m.totalShifts,0);
  const totalLeaveDays=monthTotals.reduce((a,m)=>a+m.leaveDays,0);
  const totalMonths=mkKeys.length;

  // Current month prediction
  const todayD=new Date();
  const curMk=`${todayD.getFullYear()}-${String(todayD.getMonth()+1).padStart(2,'0')}`;
  const curData=months[curMk];
  const dayOfMonth=todayD.getDate();
  const daysInMonth=new Date(todayD.getFullYear(),todayD.getMonth()+1,0).getDate();
  let predictedNet=u.salary;
  if(curData&&dayOfMonth>1){
    const dailyRate=(curData.bonus-curData.deduct)/dayOfMonth;
    const curAdv=getTotalAdvance(u.id,todayD.getFullYear(),todayD.getMonth());
    predictedNet=u.salary+(dailyRate*daysInMonth)-curAdv;
  }

  // Chart data — last 6 months
  const last6=monthTotals.slice(-6);
  const maxBar=Math.max(...last6.map(m=>m.net),u.salary);

  // Streak calculation
  let streak=0,maxStreak=0,tempStreak=0;
  const today=new Date();
  const todayKey=`${u.id}|${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  // count consecutive worked days backwards
  for(let i=0;i<60;i++){
    const d2=new Date(today);d2.setDate(today.getDate()-i);
    const k2=`${u.id}|${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}-${String(d2.getDate()).padStart(2,'0')}`;
    const v=DB.shifts[k2];
    if(v&&v!=='none'&&v!=='leave'){if(i===0||streak>0) streak++; tempStreak++;}
    else{if(tempStreak>maxStreak) maxStreak=tempStreak; tempStreak=0; if(streak>0) break;}
  }
  if(tempStreak>maxStreak) maxStreak=tempStreak;

  el.innerHTML=`
    <!-- PREDICTION -->
    <div class="an-prediction">
      <h4>🔮 ${isAr?'توقع آخر الشهر':'Month Prediction'}</h4>
      <div class="an-prediction-val">${predictedNet.toFixed(0)} ${isAr?'ج':'EGP'}</div>
      <div class="an-prediction-sub">${isAr?`بناءً على ${dayOfMonth} يوم من الشهر ده`:`Based on ${dayOfMonth} days this month`}</div>
    </div>

    <!-- OVERVIEW -->
    <div class="an-section">
      <div class="an-section-title">${isAr?'إجمالي':'Overview'}</div>
      <div class="an-cards">
        <div class="an-card highlight">
          <div class="an-label">${isAr?'متوسط الشهر':'Avg Month'}</div>
          <div class="an-val blue">${avgNet.toFixed(0)}</div>
          <div class="an-sub">${isAr?`على ${totalMonths} شهر`:`over ${totalMonths} months`}</div>
        </div>
        <div class="an-card highlight-green">
          <div class="an-label">${isAr?'أعلى شهر':'Best Month'}</div>
          <div class="an-val green">${maxNet.toFixed(0)}</div>
          <div class="an-sub">${maxY?T[lang].months[parseInt(maxM)-1]+' '+maxY:'-'}</div>
        </div>
        <div class="an-card">
          <div class="an-label">${isAr?'متوسط الزيادة':'Avg Bonus'}</div>
          <div class="an-val amber">+${avgBonus.toFixed(0)}</div>
          <div class="an-sub">${isAr?'في الشهر':'per month'}</div>
        </div>
        <div class="an-card">
          <div class="an-label">${isAr?'إجمالي الشيفتات':'Total Shifts'}</div>
          <div class="an-val">${totalShiftsAll}</div>
          <div class="an-sub">${isAr?`${totalLeaveDays} يوم إجازة`:`${totalLeaveDays} leave days`}</div>
        </div>
      </div>
    </div>

    <!-- CHART -->
    <div class="an-section">
      <div class="an-section-title">${isAr?'آخر 6 شهور':'Last 6 Months'}</div>
      <div class="an-card full">
        <div class="an-chart-bars">
          ${last6.map(m=>{
            const [y,mo2]=m.mk.split('-');
            const pct=Math.max((m.net/maxBar)*100,4);
            const color=m.net>=u.salary?'var(--green)':'var(--red)';
            const shortMo=T[lang].months[parseInt(mo2)-1].slice(0,3);
            return `<div class="an-chart-bar-wrap">
              <div class="an-chart-bar" style="height:${pct}%;background:${color};opacity:0.85"></div>
              <div class="an-chart-bar-lbl">${shortMo}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--text3)">
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block"></span>${isAr?'فوق الراتب':'Above salary'}</span>
          <span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block"></span>${isAr?'تحت الراتب':'Below salary'}</span>
        </div>
      </div>
    </div>

    <!-- STREAK -->
    ${streak>1?`<div class="an-section">
      <div class="an-section-title">${isAr?'تسلسل الشغل':'Work Streak'}</div>
      <div class="an-streak">
        <div class="an-streak-icon">🔥</div>
        <div class="an-streak-text">
          <h4>${streak} ${isAr?'يوم متتالي':'days in a row'}</h4>
          <p>${isAr?`أعلى تسلسل: ${maxStreak} يوم`:`Best streak: ${maxStreak} days`}</p>
        </div>
      </div>
    </div>`:''}

    <!-- SHIFT BREAKDOWN -->
    <div class="an-section">
      <div class="an-section-title">${isAr?'توزيع الشيفتات':'Shift Breakdown'}</div>
      <div class="an-card full">
        ${[
          {label:isAr?'شيفت بليل عادي':'Night Regular',val:monthTotals.reduce((a,m)=>a+m.nights,0),color:'var(--blue)'},
          {label:isAr?'صبح + بليل عادي':'Full Regular',val:monthTotals.reduce((a,m)=>a+m.fulls,0),color:'var(--green)'},
          {label:isAr?'بليل يوم إجازة':'Night Day Off',val:monthTotals.reduce((a,m)=>a+m.offNights,0),color:'var(--amber)'},
          {label:isAr?'صبح+بليل يوم إجازة':'Full Day Off',val:monthTotals.reduce((a,m)=>a+m.offFulls,0),color:'var(--red)'},
        ].map(s=>{
          const pct=totalShiftsAll>0?Math.round((s.val/totalShiftsAll)*100):0;
          return `<div class="an-bar-wrap">
            <div class="an-bar-label"><span>${s.label}</span><span style="color:${s.color}">${s.val} (${pct}%)</span></div>
            <div class="an-bar-track"><div class="an-bar-fill" style="width:${pct}%;background:${s.color}"></div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}


let currentPage='calendar';
let undoStack=null,toastTimer=null;
updateTopbars();render();

// SERVICE WORKER + NOTIFICATIONS
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    navigator.serviceWorker.addEventListener('message',e=>{
      if(e.data?.type==='CHECK_TODAY'){
        const u=curUser();
        const k=`${u.id}|${e.data.date}`;
        const shift=DB.shifts[k]||'none';
        if(shift==='none') navigator.serviceWorker.controller?.postMessage({type:'TODAY_NOT_LOGGED'});
      }
    });
  }).catch(()=>{});
}

function checkTodayShift(){
  const u=curUser();
  const now=new Date();
  const k=key(u.id,now.getFullYear(),now.getMonth(),now.getDate());
  if(DB.shifts[k]&&DB.shifts[k]!=='none') return;
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const msgs=lang==='ar'?[
    'عندك شيفت النهارده؟ متنساش تسجله! 📅',
    'سجّل شيفتك النهارده عشان المرتب يبقى صح 💰',
    'تذكير: لسه مسجلتش شيفت النهارده ⏰'
  ]:[
    "Don't forget to log today's shift! 📅",
    "Log your shift to keep salary accurate 💰",
    "Reminder: today's shift not logged yet ⏰"
  ];
  const msg=msgs[Math.floor(Math.random()*msgs.length)];
  const n=new Notification('My Shifts',{body:msg,icon:'/icon.png',tag:'shift-reminder'});
  n.onclick=()=>{window.focus();n.close();};
}

function scheduleLocalChecks(){
  const TIMES=[9,14,20];
  const now=new Date();
  TIMES.forEach(h=>{
    const target=new Date(now);
    target.setHours(h,0,0,0);
    if(target<=now) target.setDate(target.getDate()+1);
    setTimeout(()=>checkTodayShift(),target-now);
  });
}

function requestNotifPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted'){scheduleLocalChecks();return;}
  if(Notification.permission==='default'){
    Notification.requestPermission().then(p=>{
      if(p==='granted'){
        scheduleLocalChecks();
        showToastMsg(lang==='ar'?'✅ هيتذكرك 3 مرات في اليوم':'✅ Will remind you 3 times a day');
      }
    });
  }
}

function showToastMsg(msg){
  const toast=document.getElementById('toast');
  const msgEl=document.getElementById('toast-msg');
  const undoBtn=document.getElementById('toast-undo-btn');
  if(!toast) return;
  msgEl.textContent=msg;
  undoBtn.style.display='none';
  toast.classList.add('show');
  setTimeout(()=>{toast.classList.remove('show');undoBtn.style.display='';},3000);
}

setTimeout(requestNotifPermission,3000);

// NAV INDICATOR
const NAV_ORDER=['calendar','history','leave','analytics'];
function moveIndicator(idx){
  const ind=document.getElementById('nav-indicator');
  if(!ind) return;
  const realIdx=lang==='ar'?(NAV_ORDER.length-1-idx):idx;
  ind.style.transform=`translateX(${realIdx*100}%)`;
}
moveIndicator(0);

// OVERRIDE showPage
const _origShowPage=showPage;
window.showPage=function(p){
  currentPage=p;
  _origShowPage(p);
  moveIndicator(NAV_ORDER.indexOf(p));
  const fab=document.getElementById('fab-btn');
  if(!fab) return;
  const fabIcons={calendar:'+',history:'📄',leave:'✓',analytics:'',users:'+'};
  const fabActions={calendar:'openTodayShift()',history:'exportCurrentMonth()',leave:'applyLeave()',users:'openAddUser()'};
  fab.innerHTML=fabIcons[p]||'+';
  fab.setAttribute('onclick',fabActions[p]||'openTodayShift()');
  fab.classList.toggle('hide',p==='users'||p==='analytics');
};

// QUICK TAP CYCLING (tap = next shift, no modal)
const CYCLE_NORMAL=['none','night','full'];
const CYCLE_OFFDAY=['none','night','off-night','off-full'];
function quickTapDay(day){
  const u=curUser();
  if(isLocked(u.id,yr,mo)) return;
  const k=key(u.id,yr,mo,day);
  const cur=DB.shifts[k]||'none';
  const offDay=isOffDay(yr,mo,day,u.offDay);
  const cycle=offDay?CYCLE_OFFDAY:CYCLE_NORMAL;
  const idx=cycle.indexOf(cur);
  const next=cycle[(idx+1)%cycle.length];
  // save for undo
  undoStack={k,prev:cur};
  DB.shifts[k]=next;
  saveDB();render();
  showToast(next,day);
}

// LONG PRESS = modal (keep existing openShift)
let pressTimer=null;
function startPress(day){
  pressTimer=setTimeout(()=>{pressTimer=null;openShift(day);},500);
}
function endPress(day){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;quickTapDay(day);}
}

// TOAST + UNDO
function showToast(shiftId,day){
  if(toastTimer) clearTimeout(toastTimer);
  const msg=document.getElementById('toast-msg');
  const toast=document.getElementById('toast');
  const undoBtn=document.getElementById('toast-undo-btn');
  const label=getShiftLabel(shiftId);
  msg.textContent=`${day} ${T[lang].months[mo]} — ${label}`;
  undoBtn.textContent=lang==='ar'?'↩ تراجع':'↩ Undo';
  toast.classList.add('show');
  toastTimer=setTimeout(()=>{toast.classList.remove('show');undoStack=null;},3000);
}

function undoShift(){
  if(!undoStack) return;
  DB.shifts[undoStack.k]=undoStack.prev;
  saveDB();render();
  undoStack=null;
  const toast=document.getElementById('toast');
  toast.classList.remove('show');
  if(toastTimer) clearTimeout(toastTimer);
}

// FAB FUNCTIONS
function openTodayShift(){
  const today=new Date();
  if(today.getMonth()===mo&&today.getFullYear()===yr){
    openShift(today.getDate());
  } else {
    yr=today.getFullYear();mo=today.getMonth();
    render();setTimeout(()=>openShift(today.getDate()),100);
  }
}

function exportCurrentMonth(){
  const u=curUser();
  const mk=`${yr}-${String(mo+1).padStart(2,'0')}`;
  exportMonth(u.id,mk,{stopPropagation:()=>{}});
}

// BACKUP & RESTORE
function backupDB(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`myshifts_backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
}

function restoreDB(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const restored=JSON.parse(ev.target.result);
        if(!restored.users||!restored.shifts) throw new Error();
        Object.assign(DB,restored);
        saveDB();
        currentUser=DB.users[0].id;
        render();renderHistory();renderUsers();updateTopbars();
        alert(lang==='ar'?'✅ تم استعادة البيانات':'✅ Data restored');
      }catch(e){alert(lang==='ar'?'❌ الملف غلط':'❌ Invalid file');}
    };
    reader.readAsText(file);
  };
  input.click();
}

// ANIMATE number value
function animateValue(el,end,duration=500){
  if(!el) return;
  const start=parseFloat(el.textContent.replace(/[^0-9.-]/g,''))||0;
  const startTime=performance.now();
  function step(now){
    const p=Math.min((now-startTime)/duration,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(ease*(end-start)+start);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
